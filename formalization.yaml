status:
  scope: >-
    Proved for finite simple graphs (any universe), under the hypotheses of each statement: the
    four forms of Menger's theorem listed in the description plus weak duality; the Bondy–Chvátal
    closure step for non-adjacent u, v with deg u + deg v ≥ n; Ore's and Dirac's theorems for
    n ≥ 3 under their degree conditions; the Chvátal–Erdős theorem for n ≥ 3, k-connected graphs
    with independence number at most k; and (version 2) the Erdős–Gallai bounds for graphs with
    no path on k vertices, resp. (k ≥ 3) no cycle of length at least k, and Bondy's theorem for
    Hamiltonian graphs with n ≥ 3 and n² ≤ 4e(G).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "autonomous"
      models: ["Aristotle (Harmonic)"]
      framework: "Aristotle CLI"
      tool_setup: >-
        Produced all proofs in three runs from the formal statements and proof plans (Menger's
        theorem first, then the Hamiltonian results using it, and for version 2 the Erdős–Gallai
        and Bondy theorems on top of the same library); each return was audited (statements and
        headers unchanged, library unchanged, no added axioms) and rebuilt locally.
      cost:
        wall_time: "about two and a half hours in total"
        spend_usd: "not tracked"
        hardware: "API-only"
      prompting_notes: "Formal statements and proof plans supplied for each run."
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Statement design (separators, vertex connectivity, forms of Menger's theorem aligned with
        Mathlib's edge connectivity; for version 2 the long-cycle statements, checked by brute force
        on all graphs with at most 8 vertices), proof plans, integration and review of the Aristotle
        returns, and the Palomar packaging, checked with `lake build` and `#print axioms` (Lean
        v4.35.0-rc3, Mathlib c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "a few hours"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The results were chosen by the human author; the Lean proofs are AI-generated and
    mechanically verified (no `sorry`, axioms limited to propext, Classical.choice and
    Quot.sound, identical elaborated types for the Challenge/Solution pair).

fidelity:
  divergences: >-
    Menger's minimax is stated existentially (a separator X together with |X| disjoint paths),
    which with weak duality is the equality of the optimum values; paths are Mathlib walks with
    IsPath, vertex-disjointness is disjointness of supports, edge-disjointness of edge lists.
    Vertex connectivity is defined in the Challenge (more than k vertices, connected after deleting
    any set of fewer than k vertices, via `G.induce Sᶜ`). The independence number condition is
    stated as "every independent set has at most k vertices". Ore's and Dirac's degree conditions
    use Mathlib's `degree` and `minDegree` with integer arithmetic (n ≤ deg u + deg v,
    n ≤ 2 · minDegree). Version 2: "no path on k vertices" is stated as "every path has length at
    most k − 2" and "no cycle of length at least k" as "every cycle has length less than k"; the
    edge bounds are stated without division (2e ≤ (k − 2)n, 2e ≤ (k − 1)(n − 1), with truncated
    natural subtraction), and Bondy's exceptional graph is given up to Mathlib graph isomorphism
    with `completeBipartiteGraph (Fin (n/2)) (Fin (n/2))`.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent
    designed and compared the statements with the classical theorems, checked that the
    Aristotle returns left every statement, definition and header unchanged, and confirmed by
    `lake build`, `#print axioms` and a comparison of the fully elaborated Challenge and Solution
    types that the proofs use no `sorry` and only propext, Classical.choice and Quot.sound. The
    author directed the work and approved the statements. No independent human mathematical
    review has been performed. The results are classical; no mathematical novelty is claimed.

