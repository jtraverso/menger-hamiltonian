# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Menger's theorem, Hamiltonian cycles, long cycles and pancyclicity"
  description: >-
    A Lean 4 / Mathlib formalization of Menger's theorem for finite graphs (set form with a
    minimum separator and as many vertex-disjoint paths, two-vertex form, edge form for Mathlib's
    IsEdgeReachable, and the global edge form for Mathlib's IsEdgeConnected) and of classical
    sufficient conditions for Hamiltonian cycles: the Bondy–Chvátal closure step, Ore's and
    Dirac's theorems, and the Chvátal–Erdős theorem (k-connected with independence number at most
    k implies Hamiltonian), whose proof uses Menger's theorem through the fan lemma. Version 2 adds
    the Erdős–Gallai theorems on long paths and cycles (no path on k vertices implies
    2e ≤ (k − 2)n; no cycle of length at least k ≥ 3 implies 2e ≤ (k − 1)(n − 1)) and Bondy's
    pancyclicity theorem (a Hamiltonian graph with at least n²/4 edges is pancyclic or is
    K_{n/2,n/2}), proved on top of the same library.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C40", "05C45", "05C38", "05C35"]

